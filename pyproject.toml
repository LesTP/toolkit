[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jsonschema"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
google = ["google-genai"]
ws = ["websockets>=13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
